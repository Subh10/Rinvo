[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rinvo"
version = "0.1.0"
description = "Open-source, self-hostable text-to-speech API and developer toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Rinvo contributors"}]
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.3,<3.0",
  "soundfile>=0.12,<1.0",
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0", "httpx>=0.27,<1.0", "ruff>=0.5,<1.0"]
demo = ["gradio>=4.36,<6.0"]
chatterbox = ["chatterbox-tts"]
# The optional Chatterbox extra installs the upstream runtime, but model weights are downloaded separately at first use.
# Review upstream model/checkpoint terms and hardware requirements before enabling real inference.

[tool.hatch.build.targets.wheel]
packages = ["src/rinvo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
